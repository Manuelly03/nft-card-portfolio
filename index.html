<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="images/favicon-32x32.png" type="image/png" />
  <title>NFT Preview Card Component</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="card">
    <div class="card__image-wrapper">
      <img src="images/image-equilibrium.jpg" alt="Equilibrium NFT artwork" class="card__image" />
      <div class="card__image-overlay">
        <img src="images/icon-view.svg" alt="" class="card__view-icon" />
      </div>
    </div>

    <h1 class="card__title">Equilibrium #3429</h1>

    <p class="card__description">
      Our Equilibrium collection promotes balance and calm.
    </p>

    <div class="card__info">
      <div class="card__price">
        <img src="images/icon-ethereum.svg" alt="Ethereum" />
        <span>0.041 ETH</span>
      </div>
      <div class="card__time">
        <span>3 days left</span>
      </div>
    </div>

    <hr class="card__divider" />

    <div class="card__creator">
      <img src="images/image-avatar.png" alt="Creator avatar" class="card__avatar" />
      <p>Creation of <span>Jules Wyvern</span></p>
    </div>
  </main>

</body>
</html>
